# Temporary (#185): runs the reusable workflow from this branch on GitHub's
# own runners, once with the default runner and once with a JSON list, to see
# fromJSON(inputs.runner) pick a machine. Removed before merge.
name: runner check

on:
  pull_request:

permissions:
  contents: read

jobs:
  default:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-docs.yml
    with:
      hub: https://docs.example.com
      repo: specreview
      docs: packages/site/test/smoke-docs
  listed:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-docs.yml
    with:
      hub: https://docs.example.com
      repo: specreview
      docs: packages/site/test/smoke-docs
      runner: '["ubuntu-latest"]'
