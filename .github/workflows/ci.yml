name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # No token left in .git/config while install runs third-party code.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm }
      # Before install: the check reads only package.json files, and install
      # is when a package's own scripts would run.
      - name: Every package has typecheck, test and build, and runs nothing on install
        run: node scripts/check-packages.mjs
      - run: pnpm install --frozen-lockfile
      # Hooks are skippable locally, so the rules they carry are checked here too.
      - name: Branch name
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "$BRANCH" | grep -Eq '^(feature|bugfix|hotfix|chore|fix|ci|infra|refactor|docs)/[0-9]+-[a-z0-9.-]+$|^release/[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "branch '$BRANCH' must be <prefix>/<issue>-<slug> or release/<x.y.z>"; exit 1; }
      - name: Commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # Only the commits the pull request brings that develop does not
        # already hold (#84): a release PR into main carries all of develop,
        # whose history is never rewritten, so its old messages cannot change.
        run: |
          git fetch -q --no-tags origin develop
          # An assignment, so a failing rev-list fails the step (bash -e) rather
          # than leaving nothing to check.
          shas=$(git rev-list --no-merges "$HEAD" "^$BASE" ^FETCH_HEAD)
          echo "checking $(echo "$shas" | grep -c .) commit(s)"
          for sha in $shas; do
            git log -1 --format=%B "$sha" | pnpm exec commitlint || exit 1
          done
      # A squash merge lands the title as the commit's subject, which no
      # commit on the branch carries; it is checked here instead.
      - name: Pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint
      - name: No secrets files
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only --diff-filter=d "$BASE" "$HEAD" | grep -E '(^|/)(\.env|\.dev\.vars)|\.pem$' | grep -v '\.example$'; then
            echo "secrets files must not be committed (above)"; exit 1
          fi
      - name: Lint (no --fix)
        run: pnpm lint:check
      - name: Format
        run: pnpm format:check
      - name: Typecheck (tsc per package, separate from any bundler)
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
      # publish/dist is committed (an action runs it without installing), so
      # it must match its source.
      - name: The publish action's bundle is current
        run: test -z "$(git status --porcelain -- publish/dist)" || { git status --porcelain -- publish/dist; echo "run pnpm build and commit publish/dist"; exit 1; }
