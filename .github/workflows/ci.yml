name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # No token left in .git/config while install runs third-party code.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Hooks are skippable locally, so the rules they carry are checked here too.
      - name: Branch name
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "$BRANCH" | grep -Eq '^(feature|bugfix|hotfix|chore|fix|ci|infra|refactor|docs)/[0-9]+-[a-z0-9.-]+$|^release/[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "branch '$BRANCH' must be <prefix>/<issue>-<slug> or release/<x.y.z>"; exit 1; }
      - name: Commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE" --to "$HEAD"
      - name: Every package has typecheck, test and build
        run: pnpm check:packages
      - name: Lint (no --fix)
        run: pnpm lint:check
      - name: Format
        run: pnpm format:check
      - name: Typecheck (tsc per package, separate from any bundler)
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
