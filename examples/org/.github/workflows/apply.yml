# Applies specreview.config.json to the hub on every push to main, and on
# "Run workflow" for the first install. Needs the CLOUDFLARE_API_TOKEN secret.
# A repository secret reaches workflows on any branch, and every push to
# main runs this repo's apply.sh with it: anyone with write access to this
# repo can get the token. Give write access only to the people who
# administer the hub; the README says what paid plans add.
name: apply

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # apply.sh commits hub.json

# One apply at a time; a running one is never cancelled half way.
concurrency:
  group: apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # apply.sh rebases onto a newer main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: ./apply.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
