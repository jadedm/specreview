# .github/workflows/docs.yml in a product repo: one job calling specreview's
# reusable workflow, which builds the docs folder and publishes it. The hub's
# config names this file (site.workflow), the branch, and the repo's numeric
# id, and the hub accepts publishes only from that reusable workflow, pinned
# to the hub's specreview commit or the one it ran before. Replace
# <specreview-commit> with the full commit SHA a specreview release tag points
# to (gh api repos/jadedm/specreview/commits/v0.5.0 --jq .sha), the same commit
# as the hub's specreview.commit.
name: docs

on:
  push:
    branches: [develop]
  # Pull requests build the docs and stop; only a push publishes.
  pull_request:

# One publish at a time, in order; a newer run never races an older one.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs:
    # The called workflow's build job reads the repo; its publish job asks
    # GitHub for the token the hub checks.
    permissions:
      contents: read
      id-token: write
    uses: jadedm/specreview/.github/workflows/publish-docs.yml@<specreview-commit>
    with:
      hub: https://docs.example.com
      repo: sidecar
      docs: docs
      # exclude: |   # paths in the docs folder not to publish, one per line
      #   drafts/
      # prototypes: |   # paths in the docs folder published untouched as prototypes
      #   product/prototypes
